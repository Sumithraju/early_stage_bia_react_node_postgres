<rect x="739.6" y="40" width="112.80000000000001" height="30" rx="6" fill="#EEF2FF" stroke="#B9C2FA" stroke-width="1.25"/>
<text x="796" y="60" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4338CA">External API</text>
