<path d="M620,262 L444,262" stroke="#8A8A9C" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="532.0" y="255" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6B6B7B">normalised records</text>
<rect x="408" y="286" width="596" height="76" rx="6" fill="none" stroke="#E3E3EA" stroke-width="1.25"/>
<rect x="408" y="286" width="140" height="18" rx="6" fill="#F7F7FB" stroke="#E3E3EA" stroke-width="1"/>
<text x="418" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="#6B6B7B">ALT · DATABASE SET</text>
<path d="M444,328 L950,328" stroke="#8A8A9C" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="697.0" y="321" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6B6B7B">de-duplicate + insert</text>
<text x="418" y="352" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#6B6B7B">else — persisted:false, the search still returns</text>
<path d="M444,388 L268,388" stroke="#8A8A9C" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="356.0" y="381" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6B6B7B">results</text>
<path d="M268,416 L92,416" stroke="#8A8A9C" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="180.0" y="409" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6B6B7B">result cards</text>
<text x="40" y="474" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6B6B7B">The optional block is the only branch: with no database the search returns identically and simply is not stored.</text>
