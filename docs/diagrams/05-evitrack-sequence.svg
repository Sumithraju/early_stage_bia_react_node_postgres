<path d="M92,102 L268,102" stroke="#8A8A9C" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<text x="180.0" y="95" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#6B6B7B">query + source</text>
