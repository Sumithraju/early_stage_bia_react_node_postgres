<text x="300" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B6B7B">× 9%</text>
<rect x="400" y="102" width="99.0" height="16" rx="3" fill="#B9C2FA"/>
<text x="940" y="115" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#1A1A22">720,000</text>
<line x1="40" y1="130" x2="940" y2="130" stroke="#E3E3EA" stroke-width="1"/>
<text x="40" y="156" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1A1A22">Diagnosed</text>
<text x="300" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B6B7B">× 75%</text>
