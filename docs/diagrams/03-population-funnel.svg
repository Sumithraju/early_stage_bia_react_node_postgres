<text x="940" y="235" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#1A1A22">252,450</text>
<line x1="40" y1="250" x2="940" y2="250" stroke="#E3E3EA" stroke-width="1"/>
<text x="40" y="276" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1A1A22">Able to access</text>
<text x="300" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B6B7B">× 90%</text>
<rect x="400" y="262" width="55.6" height="16" rx="3" fill="#B9C2FA"/>
<text x="940" y="275" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#1A1A22">227,205</text>
<line x1="40" y1="290" x2="940" y2="290" stroke="#E3E3EA" stroke-width="1"/>
<text x="40" y="316" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1A1A22">Willing to treat</text>
