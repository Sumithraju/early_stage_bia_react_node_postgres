<text x="940" y="315" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#0B6E64">181,764</text>
<text x="40" y="352" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6B6B7B">Year 1. Bars use a square-root scale so the lower steps stay visible; the figures beside them are exact. Total reduction: 44×.</text>
