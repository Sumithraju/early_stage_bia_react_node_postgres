<text x="940" y="195" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#1A1A22">297,000</text>
<line x1="40" y1="210" x2="940" y2="210" stroke="#E3E3EA" stroke-width="1"/>
<text x="40" y="236" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#1A1A22">Payer eligible</text>
<text x="300" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6B6B7B">× 85%</text>
