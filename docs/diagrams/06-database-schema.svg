<text x="58" y="434" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6B6B7B">The interface requires none of this — the model lives in sessionStorage.</text>
<text x="40" y="466" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#6B6B7B">Applied by migrate.js. Every statement is IF NOT EXISTS, so the schema is safe to replay on each boot.</text>
