services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bia_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bia"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    # Built from the repository root so sql/ is inside the build context.
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bia
      CLIENT_ORIGIN: http://localhost:5173
      ENABLE_PUBLIC_SYNC: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  bia_pgdata:
